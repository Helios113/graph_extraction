name = "qwen_jac_trained"
pipeline = "jacobians"
model = "Qwen/Qwen2.5-0.5B"   # HF model id, passed to AutoModelForCausalLM.from_pretrained
input_name = "input_ids"
vocab_size = 151646
batch = 32                   # 14336 (8*896) Jacobian elements chunked in batches of this size; also
                               # evenly divides d_model=896 for jacobian_position-restricted (single-token) runs
seq = 8
d_model = 896
needs_layernorm_patch = false
samples = 20
save_dir = "qwen_jac_partial_trained_dataset_qr"
slogdet_only = true

[input_source]
mode = "dataset"
tokenizer = "Qwen/Qwen2.5-0.5B"
dataset = "Salesforce/wikitext"
dataset_config = "wikitext-2-raw-v1"
split = "train"
text_column = "text"

[[sublayers]]
input = "embedding"
output = "add_6"


[[sublayers]]
input = "add_6"
output = "add_8"


[[sublayers]]
input = "add_68"
output = "add_72"

[[sublayers]]
input = "add_72"
output = "add_74"


[[sublayers]]
input = "add_140"
output = "add_144"

[[sublayers]]
input = "add_144"
output = "add_146"