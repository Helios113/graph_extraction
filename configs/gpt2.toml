name = "gpt2"
model = "openai-community/gpt2"   # HF model id, passed to AutoModelForCausalLM.from_pretrained
input_name = "input_ids"
vocab_size = 50257
batch = 25026                   # Jacobian one-hot sweep is chunked in batches of this size
seq = 4
d_model = 768
block_prefix = "/transformer/h"   # decoder-block name prefix in the optimum KV-cache export
network_dims = [448, 128]   # autoencoder hidden/latent dims after d_model -- (d_model + 128) / 2, 128

[input_source]
tokenizer = "SimpleStories/SimpleStories-V2-11M"
dataset = "Salesforce/wikitext"
dataset_config = "wikitext-2-raw-v1"
split = "train"
text_column = "text"


[[sublayers]]
input = "input_ids"
output = "add"
loss_type = "MaskedSumLoss"
input_shape = [32, 4, 768]

