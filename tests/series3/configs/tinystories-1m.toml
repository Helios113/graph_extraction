name = "tinystories-1m"
model = "roneneldan/TinyStories-1M"   # HF model id, passed to AutoModelForCausalLM.from_pretrained
input_name = "input_ids"
vocab_size = 50257
batch = 1024                   # Jacobian one-hot sweep is chunked in batches of this size
seq = 4
d_model = 64
block_prefix = "/transformer/h"   # decoder-block name prefix in the optimum KV-cache export
network_dims = [96, 128]   # autoencoder hidden/latent dims after d_model

[input_source]
tokenizer = "SimpleStories/SimpleStories-V2-11M"
dataset = "Salesforce/wikitext"
dataset_config = "wikitext-2-raw-v1"
split = "train"
text_column = "text"


[[sublayers]]
input = "input_ids"
output = "add"
loss_type = "JacobianExtractorLoss"
input_shape = [32, 4, 64]

