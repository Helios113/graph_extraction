name = "smollm2-135m"
model = "HuggingFaceTB/SmolLM2-135M"   # HF model id, passed to AutoModelForCausalLM.from_pretrained
input_name = "input_ids"
vocab_size = 49152
batch = 1024                   # Jacobian one-hot sweep is chunked in batches of this size
seq = 4
d_model = 576
block_prefix = "/model/layers"   # decoder-block name prefix in the optimum KV-cache export
network_dims = [352, 128]   # autoencoder hidden/latent dims after d_model

[input_source]
tokenizer = "SimpleStories/SimpleStories-V2-11M"
dataset = "Salesforce/wikitext"
dataset_config = "wikitext-2-raw-v1"
split = "train"
text_column = "text"


