[project]
name = "new-jac"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beartype>=0.22.9",
    "datasets>=5.0.0",
    "h5py>=3.16.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "notebook>=7.6.1",
    "onnx>=1.22.0",
    "onnxruntime-training>=1.19.2",
    "onnxscript>=0.7.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.uv.sources]
# onnxruntime-training = { url = "https://github.com/Helios113/onnxruntime/releases/download/grad-1.20.0/onnxruntime_training-1.20.0%2Bcu128-cp311-cp311-linux_x86_64.whl" }
onnxruntime-training = { path = "/nfs-share/pa511/code_bases/onnxruntime_build_output/1.20.0/ort_build/RelWithDebInfo/dist/onnxruntime_training-1.20.0+cu128-cp311-cp311-linux_x86_64.whl" }

[tool.uv]
compile-bytecode = false

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.71",
]

[tool.ruff.lint]
# Only rule enabled for now: require a trailing comma on defs/calls that are
# already multi-line, so `ruff format` preserves the multi-line signature
# instead of collapsing it back to one line (magic trailing comma).
select = ["COM812"]

[tool.ty.rules]
# Type checking is informational only for now -- surface issues as warnings
# (editor highlights) instead of errors, so nothing is blocked/enforced.
all = "warn"
